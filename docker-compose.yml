services:
  llm-gateway:
    build: .
    image: llm-gateway:latest
    container_name: llm-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 管理员账号（首次启动 seed，之后存库；修改后需清库或改库生效）
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123        # 生产环境务必修改！
      # JWT 签名密钥（生产环境务必改成随机长字符串）
      JWT_SECRET: change-me-to-a-random-long-string
      # 主加密密钥：用于加密上游渠道 API Key。
      # 不设置则在数据卷内生成 data/.master_key 持久化；
      # 设置后即使更换数据卷也能解密（注意与数据卷二选一保持一致，避免无法解密旧数据）
      # MASTER_KEY: ""
      # CORS_ORIGIN: "*"
    volumes:
      - llm-gateway-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  llm-gateway-data:
