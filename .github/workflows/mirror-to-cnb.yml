name: Sync to CNB

# GitHub 为主、CNB 为备：push 到 GitHub 的 main/dev 后，用 CNB 官方插件 git-sync 自动同步到 CNB。
# 原因：CNB 的流水线 Runner 在境内无法连通 github.com（已实测连接超时），镜像方向反转由 GitHub Runner 执行。
# 仓库机密：GIT_PASSWORD = CNB 访问令牌(PAT)。参考同账号 workbuddy2api-gui 项目的成熟配置。

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to CNB Repository
        uses: docker://tencentcom/git-sync
        env:
          PLUGIN_TARGET_URL: "https://cnb.cool/luck4041/llm-gateway.git"
          PLUGIN_AUTH_TYPE: "https"
          PLUGIN_USERNAME: "cnb"
          PLUGIN_PASSWORD: ${{ secrets.GIT_PASSWORD }}
          PLUGIN_FORCE: "true"
